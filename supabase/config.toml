# Supabase Local, Auth & Edge Function Configuration

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.external.google]
# Set `enabled = true` when testing Google OAuth against `supabase start` locally,
# and export SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET
# in your shell (never hardcode secrets in config.toml).
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.openrouter-tts]
# Disabled gateway JWT check so both classic `anon` JWTs and newer `sb_publishable_*`
# keys work seamlessly for Fish Audio OpenRouter TTS narration.
verify_jwt = false
